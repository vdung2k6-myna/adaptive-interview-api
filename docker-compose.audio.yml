# Docker Compose for Audio Services Stack
# Usage: docker compose -f docker-compose.audio.yml up
#
# Note: This is optional. For local development, scripts/start-audio-services.bat
# or scripts/start-audio-services.sh are often simpler.
# Note: audio.cpp STT is external and not included here.

services:
  kokoro:
    build: ./kokoro-service
    ports:
      - "${KOKORO_PORT:-8081}:8081"
    environment:
      - PORT=8081
      - HOST=0.0.0.0
      - DEVICE=cpu
    volumes:
      - kokoro-models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  piper:
    build: ./piper-service
    ports:
      - "${PIPER_PORT:-8083}:8083"
    environment:
      - PORT=8083
      - HOST=0.0.0.0
      - PIPER_MODELS_DIR=/app/models
    volumes:
      - ${PIPER_MODELS_DIR:-./piper-service/models}:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  supertonic:
    build: ./supertonic-service
    ports:
      - "${SUPERTONIC_PORT:-8084}:8084"
    environment:
      - PORT=8084
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  audio-gateway:
    build: ./audio-gateway
    ports:
      - "${GATEWAY_PORT:-8082}:8082"
    environment:
      - PORT=8082
      - HOST=0.0.0.0
      - KOKORO_URL=http://kokoro:8081
      - PIPER_URL=http://piper:8083
      - SUPERTONIC_URL=http://supertonic:8084
    depends_on:
      kokoro:
        condition: service_healthy
      piper:
        condition: service_healthy
      supertonic:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  kokoro-models:
